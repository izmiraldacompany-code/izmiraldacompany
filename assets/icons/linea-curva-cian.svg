<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 421 211" role="img" aria-labelledby="title">
  <title id="title">Línea curva luminosa</title>
  <defs>
    <filter id="cyanGlow" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pointGlow" x="-300%" y="-300%" width="700%" height="700%" color-interpolation-filters="sRGB">
