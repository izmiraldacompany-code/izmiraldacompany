        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M-12 13C48 94 132 143 230 164c61 13 121 16 203 16" fill="none" stroke="#00c9f5" stroke-linecap="round" stroke-width="3" filter="url(#cyanGlow)"/>
  <path d="M-12 13C48 94 132 143 230 164c61 13 121 16 203 16" fill="none" stroke="#49dfff" stroke-linecap="round" stroke-width="1.5"/>
  <circle cx="184" cy="153" r="2.5" fill="#d9fbff" filter="url(#pointGlow)"/>
